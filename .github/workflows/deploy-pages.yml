name: GitHub Pagesへデプロイ

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: pnpmを準備
        uses: pnpm/action-setup@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: 依存パッケージをインストール
        run: pnpm install --frozen-lockfile

      - name: ビルド
        run: pnpm build

      - name: GitHub Pagesを設定
        uses: actions/configure-pages@v6

      - name: 成果物をアップロード
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v5
